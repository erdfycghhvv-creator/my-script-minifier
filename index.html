<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PISIT X WACK - PRO</title>
    <style>
        body {
            background: #080d1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #1e293b;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        textarea {
            width: 100%;
            height: 180px;
            background: #020617;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            box-sizing: border-box;
            resize: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            font-size: 16px;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center;">PISIT X WACK</h2>
    <textarea id="input" placeholder="-- ใส่ Lua Script ที่นี่ --"></textarea>
    <button onclick="minify()">เริ่มปกปิดสคริปต์</button>
</div>

<script>
function minify() {
    let text = document.getElementById("input").value;
    text = text.replace(/--\[\[[\s\S]*?\]\]/g, '');
    text = text.replace(/--.*$/gm, '');
    text = text.replace(/\s+/g, ' ').trim();
    document.getElementById("input").value = text;
}
</script>

</body>
</html>
