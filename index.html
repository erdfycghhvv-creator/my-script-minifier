<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYOUKE X ROBLOX - SCRIPT MINIFIER PRO</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --secondary: #0ea5e9;
            --bg-dark: #020617;
            --bg-panel: rgba(15, 23, 42, 0.75);
            --text-main: #f1f5f9;
            --text-glow: #38bdf8;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.2) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(14, 165, 233, 0.2) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--bg-panel);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            width: 100%;
            max-width: 650px;
            padding: 35px;
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.15);
            backdrop-filter: blur(12px);
        }
        .header { text-align: center; margin-bottom: 25px; }
        .credit-name {
            font-size: 1.1rem;
            color: var(--secondary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }
        .main-title {
            font-size: 2.2rem;
            background: linear-gradient(to right, #fff, #a78bfa, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            text-transform: uppercase;
        }
        .section-label {
            font-size: 0.85rem;
            color: var(--secondary);
            margin-bottom: 8px;
            font-weight: bold;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-glow);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus { outline: none; border-color: var(--secondary); }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .main-btn {
            flex: 1;
            padding: 14px;
            background: linear-gradient(135deg, #7c3aed, #0284c7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .copy-btn { background: linear-gradient(135deg, #059669, #10b981); }
        .main-btn:hover { transform: translateY(-2px); }

        .raw-generator {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }
        .input-url {
            width: 100%;
            padding: 10px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .footer { text-align: center; margin-top: 25px; font-size: 0.85rem; color: rgba(241, 245, 249, 0.5); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="credit-name">Ryouke X Roblox</div>
        <h1 class="main-title">Script Minifier Pro</h1>
    </div>

    <div class="section-label">1. วางสคริปต์ต้นฉบับเพื่อย่อให้เบาที่สุด:</div>
    <textarea id="scriptInput" placeholder="-- วาง Lua Script ที่นี่ --"></textarea>

    <div class="btn-group">
        <button class="main-btn" onclick="minifyScript()">ย่อสคริปต์</button>
        <button class="main-btn copy-btn" onclick="copyMinified()">คัดลอกสคริปต์ที่ย่อแล้ว</button>
    </div>

    <div class="raw-generator">
        <div class="section-label">2. แปลงเป็น Loadstring แบบสั้น (ใส่ URL จาก Raw Github/Pastebin):</div>
        <input type="text" class="input-url" id="rawUrlInput" placeholder="ตัวอย่าง: https://raw.githubusercontent.com/username/repo/main/script.lua">
        <button class="main-btn" style="width:100%" onclick="generateShortLoadstring()">สร้าง Loadstring สั้น</button>
    </div>

    <div class="footer">
        © 2026 Optimized by <b>Ryouke X Roblox</b>. Secure & Fast.
    </div>
</div>

<script>
function minifyScript() {
    let inputEl = document.getElementById("scriptInput");
    let code = inputEl.value.trim();
    if (!code) {
        alert("กรุณาวางสคริปต์ก่อนครับ!");
        return;
    }
    // ลบคอมเมนต์และช่องว่างเกินจำเป็น
    code = code.replace(/--\[\[[\s\S]*?\]\]/g, '');
    code = code.replace(/--.*$/gm, '');
    code = code.replace(/\s+/g, ' ').trim();

    inputEl.value = code;
    alert("ย่อสคริปต์สำเร็จแล้ว! คุณสามารถคัดลอกไปสร้างไฟล์บน GitHub ได้เลยครับ");
}

function copyMinified() {
    let inputEl = document.getElementById("scriptInput");
    if (!inputEl.value) return alert("ไม่มีสคริปต์ให้คัดลอกครับ!");
    inputEl.select();
    navigator.clipboard.writeText(inputEl.value);
    alert("คัดลอกเรียบร้อยแล้ว!");
}

function generateShortLoadstring() {
    let url = document.getElementById("rawUrlInput").value.trim();
    if (!url) return alert("กรุณาใส่ URL ลิงก์ Raw ก่อนครับ!");
    
    let result = `loadstring(game:HttpGet("${url}"))()`;
    let inputEl = document.getElementById("scriptInput");
    inputEl.value = result;
    inputEl.select();
    navigator.clipboard.writeText(result);
    alert("สร้าง Loadstring แบบสั้น และคัดลอกให้เรียบร้อยแล้ว!");
}
</script>

</body>
</html>
